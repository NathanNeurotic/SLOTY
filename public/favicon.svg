<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="70%" stop-color="#0F0B24" />
      <stop offset="100%" stop-color="#05030A" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="flameSeven" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <filter id="neonPuff" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Casino Token Shield -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGlow)" stroke="url(#goldBorder)" stroke-width="5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))" />
  <rect x="12" y="12" width="104" height="104" rx="22" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.8" />

  <!-- Crown on Top -->
  <path d="M40 32 L46 44 L64 26 L82 44 L88 32 L86 50 L42 50 Z" fill="url(#goldBorder)" stroke="#FFF" stroke-width="1.2" />
  <circle cx="40" cy="30" r="3" fill="#EF4444" />
  <circle cx="64" cy="24" r="4" fill="#00F0FF" />
  <circle cx="88" cy="30" r="3" fill="#EF4444" />

  <!-- Flaming 777 Centerpiece -->
  <!-- Left 7 -->
  <path d="M28 54 L48 54 L36 94 L26 94 L37 62 L28 62 Z" fill="url(#flameSeven)" stroke="#FEF08A" stroke-width="1" filter="url(#neonPuff)" />
  <!-- Center Main 7 -->
  <path d="M50 48 L78 48 L61 102 L48 102 L63 58 L50 58 Z" fill="url(#flameSeven)" stroke="#FFF" stroke-width="1.5" filter="url(#neonPuff)" />
  <!-- Right 7 -->
  <path d="M80 54 L100 54 L88 94 L78 94 L89 62 L80 62 Z" fill="url(#flameSeven)" stroke="#FEF08A" stroke-width="1" filter="url(#neonPuff)" />

  <!-- Sparkling Stars -->
  <polygon points="22,26 25,32 31,35 25,38 22,44 19,38 13,35 19,32" fill="#FFE885" />
  <polygon points="106,88 108,92 112,94 108,96 106,100 104,96 100,94 104,92" fill="#00F0FF" />
</svg>
